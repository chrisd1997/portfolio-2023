name: Build

on:
  push:
  workflow_dispatch:
  # Daily rebuild: the age on /about and the footer's year are computed at
  # build time now that the site is a static export
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run on main: it may be mid-deploy
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=

      # The server is x86, so only amd64 is built
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Scheduled runs only carry little event data, so name the branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # The key can only run bin/deploy for this repo's service (see
      # server/deploy-keys in cwdekker-server); the SHA picks the image
      - name: Deploy this commit
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "deploy@$HOST" "$GITHUB_SHA"
